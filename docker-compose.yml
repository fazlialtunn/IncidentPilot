version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=sqlite:///./incidentpilot.db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: yarn dev --host
